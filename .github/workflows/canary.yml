name: CI Pipeline (reusable)

# Reusable CI pipeline — ONE job, ONE build per event:
#   • PRs / other branches → build validation ONLY: runs the consumer's
#     release-prepare.sh with a throwaway version (0.0.0-ci). Nothing publishes.
#   • push to main → canary release: semantic-release builds ONCE at the real
#     version (prepare hook) and publishes vX.Y.Z-canary.N (main runs as a
#     prerelease branch; N derived from existing tags: dense, collision-free,
#     re-run on same HEAD is a no-op, resets after each stable release).
#   • push to hotfix/X.Y.x → SAME flow on the maintenance line: publishes
#     vX.Y.Z-hotfix.N prerelease builds (base = nearest stable reachable from
#     the branch; the distinct -hotfix identifier cannot collide with main's
#     -canary builds on a shared base). RELEASE_CHANNEL=hotfix — floating
#     pointers never move. Consumers opt in by adding "hotfix/**" to their
#     ci.yml pull_request/push branch filters.
# Stable releases are cut by the companion release-start.yml /
# release-artifacts.yml pair (reviewed draft → publish).
#
# The semantic-release config is materialized at runtime from THIS file — the
# single source of truth for all repos; consumers carry no release config.
#
# Consumer contract (see README):
#   - scripts/release-prepare.sh <version>   build artifacts (honors RELEASE_CHANNEL)
#   - scripts/release-publish.sh <version>   push artifacts  (honors RELEASE_CHANNEL)
#   - scripts/release-test.sh (OPTIONAL)     tests; runs on PRs and before every
#     canary, never on the stable rebuild — alternative: caller test jobs + needs:
#   - a dormant `stable` branch exists (semantic-release branch validation)
#   - caller grants: contents: read, packages: write, id-token: write
#     and passes `secrets: inherit`

on:
  workflow_call:
    inputs:
      docker-image:
        description: "Container image name (e.g. ghcr.io/endatix/my-api). Empty = repo publishes no image (GHCR login skipped; DOCKER_IMAGE exported empty)"
        required: false
        type: string
        default: ""
      runner:
        description: >-
          Runner for the job: a GitHub-hosted label (default ubuntu-latest; empty means the
          default) or a self-hosted runner scale set name. On a runner with no preinstalled
          toolchain, this workflow sets up only .NET and the JDK (from dotnet-version /
          java-version) and, on main and hotfix/* only, Node for semantic-release. Anything
          else the consumer's release-*.sh scripts call (Node on PRs, helm, ...) they must
          install themselves; image builds need a Docker daemon.
        required: false
        type: string
        default: "ubuntu-latest"
      dotnet-version:
        description: "Optional .NET SDK version to set up (e.g. 10.x)"
        required: false
        type: string
        default: ""
      java-version:
        description: "Optional Temurin JDK version to set up (e.g. 21)"
        required: false
        type: string
        default: ""

jobs:
  pipeline:
    name: Build / Canary
    # An empty `runner` (e.g. a caller passing an unset variable) falls back to the default
    # instead of a job with no runner label.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: Production
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # release uses the App token (env), not the git credential

      - name: 📦 Setup .NET
        if: inputs.dotnet-version != ''
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        env:
          # setup-dotnet installs into /usr/share/dotnet on Linux, which a self-hosted runner's
          # non-root user cannot write. Empty on GitHub-hosted runners keeps that default.
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && '~/.dotnet' || '' }}
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: ☕ Setup JDK
        if: inputs.java-version != ''
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      # ----- Build validation (PRs and non-releasing branches) -----
      # Reuses the consumer contract as the build check: release-prepare.sh at a
      # throwaway version builds every artifact exactly as a release would.
      # On main and hotfix/* this is SKIPPED — the release's prepare hook below
      # builds instead, so every event builds exactly once.
      - name: 🏗️ Build validation (release-prepare.sh @ 0.0.0-ci)
        if: github.ref_name != 'main' && !startsWith(github.ref_name, 'hotfix/')
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        run: scripts/release-prepare.sh "0.0.0-ci"

      # Optional contract hook: if the repo provides scripts/release-test.sh it
      # runs on EVERY event — PR validation and again before a canary release
      # (merge skew: main may differ from what the PR validated). It never runs
      # on the stable rebuild (release-artifacts.yml): a stable promotes a
      # commit whose canary already required green tests. The script may read
      # GITHUB_REF / GITHUB_EVENT_NAME for main-vs-PR filtering and may
      # parallelize internally. Repos with heavy multi-runner suites can keep
      # tests as caller jobs gating via `needs:` instead.
      - name: 🧪 Tests (release-test.sh, if present)
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        run: |
          if [ -x scripts/release-test.sh ]; then
            scripts/release-test.sh
          else
            echo "No scripts/release-test.sh — skipping (tests may live in caller jobs)"
          fi

      # ----- Release (main → canary; hotfix/* → hotfix prerelease) -----
      # Node and the semantic-release tree are downloaded BEFORE Infisical, so no tool or
      # semantic-release download runs with prod secrets in the job environment. Neither needs
      # a secret: the config below is static and npm installs from the public registry. The
      # consumer's release scripts do run with the secrets, under semantic-release; that is a
      # documented exception (AGENTS.md, "No tool download runs with ...").
      - name: 📦 Setup Node (semantic-release)
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/')
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"

      - name: 📦 Install semantic-release
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/')
        run: |
          CFG="${RUNNER_TEMP}/release-config"
          mkdir -p "$CFG"

          # Custom analyzeCommits: every push with new commits releases the next
          # canary; zero new commits (re-run on same HEAD) releases nothing.
          cat > "${CFG}/analyze-commits.cjs" <<'EOF'
          function analyzeCommits(pluginConfig, context) {
            const { commits, logger } = context;
            if (commits.length === 0) {
              logger.log("No new commits (re-run on same HEAD?) — no release");
              return null;
            }
            logger.log("Canary: %d new commit(s) → patch prerelease", commits.length);
            return "patch";
          }
          module.exports = { analyzeCommits };
          EOF

          # main as a PRERELEASE branch → semantic-release derives vX.Y.Z-canary.N
          # from existing tags; hotfix/* branches do the same with the -hotfix
          # identifier (base = nearest stable reachable from the branch, so a
          # hotfix line computes its own versions). The dormant `stable` branch
          # only satisfies the ≥1-release-branch validation. Manually created
          # stable tags (from the release-start flow) are picked up from git
          # automatically.
          cat > "${CFG}/release.config.cjs" <<'EOF'
          module.exports = {
            branches: [
              "stable",
              { name: "main", prerelease: "canary", channel: "canary" },
              { name: "hotfix/*", prerelease: "hotfix", channel: "hotfix" },
            ],
            plugins: [
              `${__dirname}/analyze-commits.cjs`,
              ["@semantic-release/release-notes-generator", { preset: "conventionalcommits" }],
              [
                "@semantic-release/exec",
                {
                  prepareCmd: "scripts/release-prepare.sh ${nextRelease.version}",
                  publishCmd: "scripts/release-publish.sh ${nextRelease.version}",
                },
              ],
              [
                "@semantic-release/github",
                {
                  // Post-release comment/label API calls need Issues/PR write on the
                  // GitHub App (it only has Contents) — keep them off.
                  successComment: false,
                  failComment: false,
                  failTitle: false,
                  releasedLabels: false,
                },
              ],
            ],
          };
          EOF

          # The package.json anchors npm to $CFG (otherwise it walks up to the
          # nearest project root and installs the tooling elsewhere).
          echo '{"private":true}' > "${CFG}/package.json"
          # --ignore-scripts: no package's install/postinstall hook runs here. The tree is
          # resolved from major ranges with no lockfile, so this removes install-time code
          # execution, not run-time: the same tree still runs in the semantic-release step,
          # with the App token and the Infisical prod env (an accepted exception, AGENTS.md).
          (cd "$CFG" && npm install --ignore-scripts --no-save --no-fund --no-audit --loglevel=error \
            semantic-release@24 @semantic-release/exec@6 conventional-changelog-conventionalcommits@8)

      - name: 🔐 Fetch secrets (Infisical, OIDC)
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/')
        uses: Infisical/secrets-action@03d3fa38607956c493f53c6633f94006a13c47ae # v1.0.7
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          recursive: true

      - name: 🔑 Endatix Automations APP token (GitHub App)
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/')
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          # App id + private key are injected by the Infisical step above.
          app-id: ${{ env.ENDATIX_PROJECT_AUTOMATIONS_APP_ID }}
          private-key: ${{ env.ENDATIX_PROJECT_AUTOMATIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }} # scope the token to the CALLER repo only

      - name: 🐳 GHCR login
        if: (github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/')) && inputs.docker-image != ''
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # packages:write is the only write scope on this token

      - name: 🐤 semantic-release (canary / hotfix channel)
        if: github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/')
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }} # App token, not the read-only job token
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          # Neither channel moves floating tags (docker latest, npm latest);
          # npm dist-tag = the channel name (canary / hotfix).
          RELEASE_CHANNEL: ${{ github.ref_name == 'main' && 'canary' || 'hotfix' }}
          # Standard environment for consumer release scripts — org-derived, exported
          # for every repo; repos that publish only a docker image simply ignore them.
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }} # packages:write — NuGet/npm push + helm registry login
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          HELM_OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          CFG="${RUNNER_TEMP}/release-config" # written by the install step above
          # DRY_RUN is never set in CI — it enables local testing of this script.
          "${CFG}/node_modules/.bin/semantic-release" \
            --extends "${CFG}/release.config.cjs" ${DRY_RUN:+--dry-run}
