name: Publish Stable Artifacts (reusable)

# Step 2 of the human-reviewed stable release flow: the caller invokes this on
# `release: types: [published]` — i.e. when a human clicks "Publish release" on
# the reviewed draft, which is the moment GitHub creates the vX.Y.Z tag.
#
# Promotion strategies (input `promotion`):
#   image-retag (default) — retag the canary Docker image digest as the stable
#       version (byte-identical, no rebuild); falls back to rebuild when no
#       canary tag points at the released commit.
#   rebuild — always run the consumer's release scripts at the tag. REQUIRED for
#       repos with non-OCI artifacts (NuGet/npm packages bake the version string
#       into the artifact and cannot be retagged).
#
# The caller must filter out prereleases (canaries publish their own artifacts):
#   if: ${{ !github.event.release.prerelease }}
# Caller grants: contents: read, packages: write.

on:
  workflow_call:
    inputs:
      docker-image:
        description: "Container image name (e.g. ghcr.io/endatix/my-api). Empty = repo publishes no image"
        required: false
        type: string
        default: ""
      promotion:
        description: "image-retag (default) or rebuild (required for NuGet/npm/Helm repos)"
        required: false
        type: string
        default: "image-retag"
      fetch-secrets:
        description: "Fetch Infisical secrets (prod) into the job env — for rebuild-path publish scripts that need more than the job token. Caller must grant id-token: write."
        required: false
        type: boolean
        default: false
      nuget-login:
        description: >-
          NOT USABLE FROM ANOTHER REPOSITORY, which is every caller; kept only because removing
          an input breaks callers that still pass it (AGENTS.md). It runs NuGet/login here, but
          nuget.org requires the token's `repository` claim to equal the policy's repo AND its
          job_workflow_ref to be a workflow of that same repo; in this reusable workflow
          `repository` is the caller and job_workflow_ref is endatix/release-workflows, so no
          policy matches. Use upload-nuget-artifacts: true and log in and push from a job in
          your own workflow.
        required: false
        type: boolean
        default: false
      upload-nuget-artifacts:
        description: >-
          Upload build/packages/nuget/*.nupkg as a workflow artifact so the CALLER can push
          them to nuget.org from its own workflow: the only way to use nuget.org trusted
          publishing with this workflow. A NuGet/login in the caller's own job presents a token
          whose `repository` and job_workflow_ref both name the caller, so a policy scoped to
          the caller repo and that workflow file matches; a login here never can. The minted
          key cannot be handed back from here either (NuGet/login marks it a secret and GitHub
          redacts secrets from job outputs). Use with nuget-login: false. Only meaningful on
          the rebuild path.
        required: false
        type: boolean
        default: false
      runner:
        description: >-
          Runner for the job: a GitHub-hosted label (default ubuntu-latest; empty means the
          default) or a self-hosted runner scale set name. On a runner with no preinstalled
          toolchain, this workflow sets up only .NET and the JDK (from dotnet-version /
          java-version). The retag needs only the docker CLI with buildx; the rebuild path runs
          the consumer's release-*.sh, which must install anything else they call, and image
          builds need a Docker daemon.
        required: false
        type: string
        default: "ubuntu-latest"
      dotnet-version:
        description: "Optional .NET SDK version for the rebuild path"
        required: false
        type: string
        default: ""
      java-version:
        description: "Optional Temurin JDK version for the rebuild path"
        required: false
        type: string
        default: ""

jobs:
  promote:
    name: Promote artifacts to stable
    # An empty `runner` (e.g. a caller passing an unset variable) falls back to the default
    # instead of a job with no runner label.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: Production # matches the Infisical OIDC identity binding
    steps:
      - name: 🔍 Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # need all tags to find the canary pointing at this commit

      # Toolchains BEFORE any credential: Infisical secrets, the nuget.org key and the GHCR login
      # all come after, so no tool download runs with them in the job.
      - name: 📦 Setup .NET
        if: inputs.dotnet-version != ''
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        env:
          # setup-dotnet installs into /usr/share/dotnet on Linux, which a self-hosted runner's
          # non-root user cannot write. Empty on GitHub-hosted runners keeps that default.
          DOTNET_INSTALL_DIR: ${{ runner.environment == 'self-hosted' && '~/.dotnet' || '' }}
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: ☕ Setup JDK
        if: inputs.java-version != ''
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: 🔐 Fetch secrets (Infisical, OIDC)
        if: inputs.fetch-secrets
        uses: Infisical/secrets-action@03d3fa38607956c493f53c6633f94006a13c47ae # v1.0.7
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: "github-actions-for-endatix"
          identity-id: "403af1ed-7046-480f-a100-c4482b8a89ac"
          recursive: true

      # Not usable from another repository (see the nuget-login input): kept for the input's
      # contract only. Short-lived nuget.org API key via OIDC trusted publishing — replaces a
      # long-lived NUGET_API_KEY secret. Must run AFTER the Infisical step: the
      # nuget.org username (profile name, not email) is injected by Infisical.
      - name: 🔑 NuGet login (OIDC → temp API key)
        if: inputs.nuget-login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.ENDATIX_NUGET_ORG_USERNAME }}

      - name: 🐳 GHCR login
        if: inputs.docker-image != ''
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Promote canary artifacts (or rebuild) as ${{ github.event.release.tag_name }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          PROMOTION: ${{ inputs.promotion }}
          # Standard environment for consumer release scripts (rebuild path) —
          # org-derived; repos that publish only a docker image ignore them.
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          HELM_OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
          # Temp key from NuGet trusted publishing when nuget-login is on;
          # falls back to an Infisical-provided NUGET_API_KEY otherwise.
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || env.NUGET_API_KEY }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Unexpected tag format: ${TAG}"; exit 1 ;; esac
          VERSION="${TAG#v}"

          # Channel: stable when this tag is the highest stable version, else a
          # maintenance release (hotfix of an older line). Maintenance must not
          # move floating pointers — docker `latest` here, and consumer publish
          # scripts only move theirs when RELEASE_CHANNEL=stable.
          HIGHEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- - | head -1)
          if [ "$TAG" = "$HIGHEST" ]; then RELEASE_CHANNEL=stable; else RELEASE_CHANNEL=maintenance; fi
          export RELEASE_CHANNEL
          echo "Release channel: ${RELEASE_CHANNEL} (this: ${TAG}, highest stable: ${HIGHEST})"

          # A canary OR hotfix prerelease build at this commit can be promoted
          # byte-identically (docker digest retag).
          CANARY_TAG=$(git tag --points-at HEAD -l 'v[0-9]*-canary.*' -l 'v[0-9]*-hotfix.*' --sort=-v:refname | head -1 || true)
          if [ "$PROMOTION" = "image-retag" ] && [ -n "$DOCKER_IMAGE" ] && [ -n "$CANARY_TAG" ]; then
            IMAGE_TAGS=(-t "${DOCKER_IMAGE}:${VERSION}")
            if [ "$RELEASE_CHANNEL" = "stable" ]; then IMAGE_TAGS+=(-t "${DOCKER_IMAGE}:latest"); fi
            echo "Promoting ${CANARY_TAG} image digest to ${VERSION} (no rebuild; latest: ${RELEASE_CHANNEL})"
            docker buildx imagetools create "${IMAGE_TAGS[@]}" "${DOCKER_IMAGE}:${CANARY_TAG#v}"
          else
            echo "Rebuilding at the tag (promotion=${PROMOTION}, canary tag: ${CANARY_TAG:-none})"
            scripts/release-prepare.sh "$VERSION"
            scripts/release-publish.sh "$VERSION"
          fi

      # Hand the built packages to the caller so it can push them to nuget.org under its
      # OWN job_workflow_ref claim. See the upload-nuget-artifacts input for why the push
      # cannot stay here and why the key cannot be passed back.
      - name: 📤 Upload NuGet packages for the caller
        if: inputs.upload-nuget-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages-${{ github.event.release.tag_name }}
          path: build/packages/nuget/*.nupkg
          if-no-files-found: error # a silent empty artifact would fail the caller confusingly
          retention-days: 7
